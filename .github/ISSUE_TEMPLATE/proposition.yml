name: Proposer une évolution
description: Une fonctionnalité, une amélioration, une simplification.
labels: ['proposition']
body:
  - type: markdown
    attributes:
      value: |
        Avant d'écrire : le projet **exclut explicitement** la gamification, les
        notifications, les algorithmes adaptatifs, le thème sombre, toute mesure
        d'audience, et le stockage du contenu à apprendre. Voir
        [CONTRIBUTING.md](https://github.com/alarboulletmarin/revoir/blob/main/CONTRIBUTING.md)
        et la section 11 du design system. Une proposition qui tombe dans cette
        liste recevra une réponse argumentée, mais probablement négative.

  - type: textarea
    id: besoin
    attributes:
      label: Le besoin
      description: >
        Ce que vous cherchiez à faire, et ce qui vous en a empêché. Le besoin
        avant la solution : il arrive que l'application sache déjà le couvrir
        autrement.
    validations:
      required: true

  - type: textarea
    id: proposition
    attributes:
      label: Ce que vous proposez
    validations:
      required: true

  - type: textarea
    id: ecran
    attributes:
      label: Où cela vivrait-il ?
      description: >
        Aujourd'hui, Calendrier, Suivi, fiche d'un sujet, réglages, aide.
        Une fonctionnalité sans écran d'accueil finit par en réclamer un.
    validations:
      required: false
